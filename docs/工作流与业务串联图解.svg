<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="100%" height="100%" fill="#fbfbfb"/>
<text x="60" y="34" font-size="22" font-weight="bold" fill="#1f3b73">工作流 × 业务办理 串联图解（以「资金使用」为例）</text>
<text x="60" y="84" font-size="15" font-weight="bold" fill="#1f3b73">① 提交申请</text>
<rect x="60" y="90" width="280" height="22" rx="11" fill="#eef3ff" stroke="#1a73e8"/>
<text x="72" y="105" font-size="12" fill="#1a73e8">操作人：物业 / PROPERTY</text>
<text x="360" y="84" font-size="15" font-weight="bold" fill="#1f3b73">② 节点1 审批</text>
<rect x="360" y="90" width="280" height="22" rx="11" fill="#eef3ff" stroke="#1a73e8"/>
<text x="372" y="105" font-size="12" fill="#1a73e8">操作人：业委会 / COMMITTEE</text>
<text x="660" y="84" font-size="15" font-weight="bold" fill="#1f3b73">③ 节点2 审批</text>
<rect x="660" y="90" width="280" height="22" rx="11" fill="#eef3ff" stroke="#1a73e8"/>
<text x="672" y="105" font-size="12" fill="#1a73e8">操作人：主管部门 / ADMIN</text>
<text x="960" y="84" font-size="15" font-weight="bold" fill="#1f3b73">④ 拨付完结</text>
<rect x="960" y="90" width="280" height="22" rx="11" fill="#eef3ff" stroke="#1a73e8"/>
<text x="972" y="105" font-size="12" fill="#1a73e8">操作人：主管部门 / ADMIN</text>
<rect x="50" y="140" width="6" height="200" fill="#c5221f"/>
<text x="58" y="132" font-size="13" font-weight="bold" fill="#c5221f">工作流层</text>
<rect x="50" y="360" width="6" height="240" fill="#e37400"/>
<text x="58" y="352" font-size="13" font-weight="bold" fill="#e37400">业务层（单据+资金）</text>
<rect x="60" y="150" width="280" height="180" rx="8" fill="#fdecec" stroke="#c5221f" stroke-width="1.5"/>
<rect x="60" y="150" width="280" height="26" rx="8" fill="#c5221f"/>
<rect x="60" y="170" width="280" height="6" fill="#c5221f"/>
<text x="72" y="168" font-size="13" font-weight="bold" fill="#fff">流程实例 t_flow_instance / t_approval</text>
<text x="72" y="194" font-size="12" fill="#222">submit() → start()</text>
<text x="72" y="214" font-size="12" fill="#222">创建流程实例</text>
<text x="72" y="234" font-size="12" fill="#222">RUNNING @节点1</text>
<rect x="360" y="150" width="280" height="180" rx="8" fill="#fdecec" stroke="#c5221f" stroke-width="1.5"/>
<rect x="360" y="150" width="280" height="26" rx="8" fill="#c5221f"/>
<rect x="360" y="170" width="280" height="6" fill="#c5221f"/>
<text x="372" y="168" font-size="13" font-weight="bold" fill="#fff">流程实例 t_flow_instance / t_approval</text>
<text x="372" y="194" font-size="12" fill="#222">approve() PASS</text>
<text x="372" y="214" font-size="12" fill="#222">写t_approval记录</text>
<text x="372" y="234" font-size="12" fill="#222">推进 RUNNING @节点2</text>
<rect x="660" y="150" width="280" height="180" rx="8" fill="#fdecec" stroke="#c5221f" stroke-width="1.5"/>
<rect x="660" y="150" width="280" height="26" rx="8" fill="#c5221f"/>
<rect x="660" y="170" width="280" height="6" fill="#c5221f"/>
<text x="672" y="168" font-size="13" font-weight="bold" fill="#fff">流程实例 t_flow_instance / t_approval</text>
<text x="672" y="194" font-size="12" fill="#222">approve() PASS 末节点</text>
<text x="672" y="214" font-size="12" fill="#222">实例 COMPLETED</text>
<rect x="960" y="150" width="280" height="180" rx="8" fill="#fdecec" stroke="#c5221f" stroke-width="1.5"/>
<rect x="960" y="150" width="280" height="26" rx="8" fill="#c5221f"/>
<rect x="960" y="170" width="280" height="6" fill="#c5221f"/>
<text x="972" y="168" font-size="13" font-weight="bold" fill="#fff">流程实例 t_flow_instance / t_approval</text>
<text x="972" y="194" font-size="12" fill="#222">实例已COMPLETED</text>
<text x="972" y="214" font-size="12" fill="#222">(工作流结束)</text>
<rect x="60" y="370" width="280" height="220" rx="8" fill="#fff4e6" stroke="#e37400" stroke-width="1.5"/>
<rect x="60" y="370" width="280" height="26" rx="8" fill="#e37400"/>
