<polygon points="352,235.0 352,245.0 360,240.0" fill="#c5221f"/>
<line x1="640" y1="240.0" x2="660" y2="240.0" stroke="#c5221f" stroke-width="1.8"/>
<polygon points="652,235.0 652,245.0 660,240.0" fill="#c5221f"/>
<line x1="940" y1="240.0" x2="960" y2="240.0" stroke="#c5221f" stroke-width="1.8"/>
<polygon points="952,235.0 952,245.0 960,240.0" fill="#c5221f"/>
<line x1="340" y1="480.0" x2="360" y2="480.0" stroke="#e37400" stroke-width="1.8"/>
<polygon points="352,475.0 352,485.0 360,480.0" fill="#e37400"/>
<line x1="640" y1="480.0" x2="660" y2="480.0" stroke="#e37400" stroke-width="1.8"/>
<polygon points="652,475.0 652,485.0 660,480.0" fill="#e37400"/>
<line x1="940" y1="480.0" x2="960" y2="480.0" stroke="#e37400" stroke-width="1.8"/>
<polygon points="952,475.0 952,485.0 960,480.0" fill="#e37400"/>
<rect x="50" y="620" width="1180" height="78" rx="8" fill="#f4f7ff" stroke="#1a73e8"/>
<text x="72" y="642" font-size="13" font-weight="bold" fill="#1a73e8">串联原理（一次调用，状态翻译）：</text>
<text x="80" y="660" font-size="12" fill="#333">• 提交：业务 submit() → workflow.start() 建实例，业务状态置 PENDING</text>
<text x="80" y="678" font-size="12" fill="#333">• 审批：业务 approve() → workflow.approve()（校验角色→写审批记录→推进/完成），返回 COMPLETED/TERMINATED/RUNNING，业务按结果翻译成 APPROVED/REJECTED/PENDING</text>
<text x="80" y="696" font-size="12" fill="#333">• 动钱：仅当业务状态=APPROVED 才允许 pay()/confirm()，扣余额+写流水 → PAID/REFUNDED（工作流不碰资金，资金逻辑不碰节点顺序）</text>
</svg>