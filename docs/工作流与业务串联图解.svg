<polygon points="795.0,362 805.0,362 800.0,370" fill="#666"/>
<text x="740.0" y="346" font-size="11" fill="#c5221f">末节点通过 → 业务置 APPROVED</text>
<line x1="1100.0" y1="330" x2="1100.0" y2="370" stroke="#666" stroke-width="1.8" stroke-dasharray="5 3"/>
<polygon points="1095.0,362 1105.0,362 1100.0,370" fill="#666"/>
