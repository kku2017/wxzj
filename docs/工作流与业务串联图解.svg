<text x="72" y="388" font-size="13" font-weight="bold" fill="#fff">单据 t_use_apply / 账户 / 流水</text>
<text x="72" y="414" font-size="12" fill="#222">DRAFT → PENDING
(审批中)</text>
<text x="72" y="434" font-size="12" fill="#222">-</text>
<rect x="360" y="370" width="280" height="220" rx="8" fill="#fff4e6" stroke="#e37400" stroke-width="1.5"/>
<rect x="360" y="370" width="280" height="26" rx="8" fill="#e37400"/>
<rect x="360" y="390" width="280" height="6" fill="#e37400"/>
<text x="372" y="388" font-size="13" font-weight="bold" fill="#fff">单据 t_use_apply / 账户 / 流水</text>
<text x="372" y="414" font-size="12" fill="#222">PENDING
(审批中，不变)</text>
<text x="372" y="434" font-size="12" fill="#222">-</text>
<rect x="660" y="370" width="280" height="220" rx="8" fill="#fff4e6" stroke="#e37400" stroke-width="1.5"/>
<rect x="660" y="370" width="280" height="26" rx="8" fill="#e37400"/>
<rect x="660" y="390" width="280" height="6" fill="#e37400"/>
<text x="672" y="388" font-size="13" font-weight="bold" fill="#fff">单据 t_use_apply / 账户 / 流水</text>
<text x="672" y="414" font-size="12" fill="#222">PENDING → APPROVED
(已批准)</text>
<text x="672" y="434" font-size="12" fill="#222">-</text>
<rect x="960" y="370" width="280" height="220" rx="8" fill="#fff4e6" stroke="#e37400" stroke-width="1.5"/>
<rect x="960" y="370" width="280" height="26" rx="8" fill="#e37400"/>
<rect x="960" y="390" width="280" height="6" fill="#e37400"/>
<text x="972" y="388" font-size="13" font-weight="bold" fill="#fff">单据 t_use_apply / 账户 / 流水</text>
<text x="972" y="414" font-size="12" fill="#222">APPROVED → PAID
(已拨付)</text>
<text x="972" y="434" font-size="12" fill="#222">资金动作</text>
<text x="972" y="454" font-size="12" fill="#222">pay() 按t_use_item分摊</text>
<text x="972" y="474" font-size="12" fill="#222">扣各户余额 + 写流水</text>
<text x="972" y="494" font-size="12" fill="#222">(账户余额减少)</text>
<line x1="200.0" y1="330" x2="200.0" y2="370" stroke="#666" stroke-width="1.8" stroke-dasharray="5 3"/>
<polygon points="195.0,362 205.0,362 200.0,370" fill="#666"/>
<text x="170.0" y="346" font-size="11" fill="#666">提交时 start() 创建实例</text>
<line x1="500.0" y1="330" x2="500.0" y2="370" stroke="#666" stroke-width="1.8" stroke-dasharray="5 3"/>
<polygon points="495.0,362 505.0,362 500.0,370" fill="#666"/>
